name: Синхронизация с Яндекс Диском
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузить файл на Яндекс Диск
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: |
          # URL-кодируем параметры, чтобы избежать проблем с символами
          FILE_URL=$(echo -n "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" | jq -sRr @uri)
          DISK_PATH=$(echo -n "disk:/git_sinc/WHITE-CIDR-RU-all.txt" | jq -sRr @uri)
          
          # Отправляем GET-запрос с параметрами в строке запроса (как требует документация)
          curl -X POST \
            -H "Authorization: OAuth $YANDEX_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources/upload?url=$FILE_URL&path=$DISK_PATH"
